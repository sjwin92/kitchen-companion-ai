project_id = "kitchen-companion"

[auth]
site_url = "https://sjwin92.github.io/kitchen-companion-ai/"
additional_redirect_urls = [
  "https://sjwin92.github.io/kitchen-companion-ai/",
  "https://sjwin92.github.io/kitchen-companion-ai/reset-password"
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[functions.scan-receipt]
verify_jwt = true

[functions.log-meal]
verify_jwt = true

[functions.generate-recipe]
verify_jwt = true

[functions.product-info]
verify_jwt = true

[functions.reconcile-receipt]
verify_jwt = true

[functions.scan-expiry]
verify_jwt = true

[functions.send-expiry-reminders]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.compare-prices]
verify_jwt = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/hook_require_beta_invite"
