name: expiry-reminders

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: expiry-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders and remove expired meal photos
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${REMINDER_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/functions/v1/send-expiry-reminders"
